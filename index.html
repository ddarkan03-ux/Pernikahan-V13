<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!--META--><title>The Wedding of Raka & Salsa</title><meta property="og:title" content="The Wedding of Raka & Salsa"><meta property="og:description" content="Dengan memohon rahmat Allah SWT, kami mengundang Anda ke pernikahan kami pada 2027-03-14."><meta property="og:image" content="https://akun.github.io/nikah-demo/foto/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:type" content="website"><meta property="og:url" content="https://akun.github.io/nikah-demo/"><meta name="description" content="Dengan memohon rahmat Allah SWT, kami mengundang Anda ke pernikahan kami pada 2027-03-14."><!--/META-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Amiri&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--iv:#faf6ee;--sg:#8a9a7b;--sgd:#5f7052;--rs:#c99a98;--gd:#b08d4a;--ink:#3b3a35}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#e9e4d8;font:16px/1.6 Inter,system-ui,sans-serif;color:var(--ink)}
.app{max-width:480px;margin:auto;background:var(--iv);min-height:100vh;padding-bottom:84px;position:relative;overflow:hidden}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
.wcb{background:radial-gradient(circle at 0 0,#c99a9899 0,transparent 36%),radial-gradient(circle at 100% 0,#8a9a7b99 0,transparent 34%),radial-gradient(circle at 0 100%,#8a9a7b88 0,transparent 34%),radial-gradient(circle at 100% 100%,#c99a9888 0,transparent 36%),var(--iv)}
section{padding:56px 24px;text-align:center;opacity:0;transform:translateY(18px);transition:.8s}section.in{opacity:1;transform:none}
section.alt{background:#f1ede0}.lb2{letter-spacing:4px;font-size:12px;text-transform:uppercase;color:var(--gd)}
h2{font-size:34px;color:var(--sgd);margin:4px 0 10px}.dv{color:var(--gd);letter-spacing:8px;margin:14px 0}.dv:before,.dv:after{content:"";display:inline-block;width:50px;height:1px;background:var(--gd);vertical-align:middle;margin:0 10px}
.btn{display:inline-block;border:0;border-radius:99px;background:var(--sgd);color:#fff;padding:10px 20px;font:500 14px Inter;cursor:pointer;text-decoration:none;margin:3px}
.btn.o{background:none;border:1.5px solid var(--sgd);color:var(--sgd)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.bg{background:linear-gradient(160deg,#dfe6d6,#f3dcd8);background-size:cover;background-position:center}
#cover{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:auto;z-index:50;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:52px 24px 34px;color:#fff;background:var(--sgd);overflow:hidden;transition:transform 1.1s cubic-bezier(.77,0,.18,1),opacity .3s 1s}
#cover.off{transform:translateY(-100%);opacity:0;pointer-events:none}
.cv-bg{position:absolute;inset:0;background-size:cover;background-position:center 38%;transform:scale(1.12);animation:kb 14s ease-out forwards}
.cv-ov{position:absolute;inset:0;background:linear-gradient(180deg,#000a 0,#0004 24%,#0000 44%,#0000 56%,#000c 100%)}
.cv-top,.cv-bot{position:relative;z-index:1;width:100%;animation:up 1.2s .2s both}.cv-bot{animation-delay:.5s}
.cv-lb{letter-spacing:6px;font-size:12px;text-transform:uppercase;margin:0 0 4px;text-shadow:0 1px 8px #0008}
.cv-nm{font:400 clamp(46px,14vw,60px)/1.1 'Great Vibes','Cormorant Garamond',cursive;margin:0;text-shadow:0 2px 16px #0009}.cv-nm i{font-style:normal;color:#e6c67e}
.cv-tg{letter-spacing:3px;font-size:13px;margin:8px 0 0;text-shadow:0 1px 8px #0009}
.cv-gst{background:#ffffff26;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ffffff55;border-radius:18px;padding:14px 20px;margin:0 0 14px}
.cv-gst small{font-size:12px;opacity:.9}.cv-gst b{display:block;font:600 24px/1.2 'Cormorant Garamond',Georgia,serif;margin-top:2px;overflow-wrap:anywhere}
.cv-nt{font-size:11px;opacity:.8;margin:12px 0 0}
.btn.g{background:#e6c67e;color:#3b3a35;padding:12px 26px;font-size:15px}
@keyframes kb{to{transform:scale(1)}}@keyframes up{from{opacity:0;transform:translateY(24px)}}
@media(prefers-reduced-motion:reduce){.cv-bg,.cv-top,.cv-bot{animation:none;transform:none}}
.nm{font-size:50px;line-height:1.1;color:var(--sgd)}.gst{background:#fff;border-radius:16px;padding:12px 22px;margin:10px 0;box-shadow:0 2px 12px #0001}.gst b{font-size:21px}
.arch{width:230px;height:300px;margin:22px auto 0;border-radius:115px 115px 14px 14px;border:3px solid var(--gd);padding:6px}.arch div{width:100%;height:100%;border-radius:109px 109px 8px 8px}
.av{width:170px;height:170px;border-radius:50%;margin:14px auto 22px;border:4px solid #fff;box-shadow:0 0 0 7px #8a9a7b66,0 0 0 12px #c99a9855}
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px #0001;margin:14px 0}
.ar{font:26px/2 Amiri,serif;direction:rtl}.cd{display:flex;gap:8px;justify-content:center;margin:18px 0}.cd div{background:#fff;border-radius:14px;padding:10px 0;width:76px;box-shadow:0 2px 10px #0001}.cd b{display:block;font:600 28px 'Cormorant Garamond'}.cd small{font-size:12px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer;background:#dfe6d6}
#lb{position:fixed;inset:0;background:#000d;z-index:60;display:none;align-items:center;justify-content:center}#lb img{max-width:92%;max-height:88%;border-radius:10px}
label{display:block;text-align:left;font-size:14px;margin:12px 0 4px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfc8b4;border-radius:12px;font:inherit;background:#fff}
#msgs{text-align:left;max-height:320px;overflow:auto;margin-top:18px}#msgs p{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:14px}
ol.kl{text-align:left;padding-left:22px;font-size:15px}
nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(460px,94vw);background:#fffe;backdrop-filter:blur(8px);border-radius:99px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 4px 20px #0003;z-index:40}
nav a{color:var(--sgd);text-decoration:none;font-size:11px;padding:3px 4px;text-align:center;line-height:1.3}nav a span{display:block;font-size:17px}
#mus{position:fixed;right:max(12px,calc(50% - 228px));bottom:84px;z-index:41;width:44px;height:44px;border-radius:50%;border:0;background:var(--gd);color:#fff;font-size:18px;cursor:pointer}
.hero{position:relative;padding:0;color:#fff;background:#a8b898;border-radius:0 0 36px 36px;overflow:hidden}
.hero .hs{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:56px 24px 104px}
.hero .hq{position:relative;z-index:1;margin-top:-34px;padding:40px 30px 64px;border-radius:34px 34px 0 0;background:linear-gradient(180deg,#bccaad,#a3b393);color:#2f3d29}
.hero .hq .dv{color:#6b5320;margin:0 0 18px}.hero .hq .dv:before,.hero .hq .dv:after{background:#6b5320}
.hero .hq .ar{color:#27361f;margin:0 0 6px}.hero .hq .ti{font-size:15px;line-height:1.7;margin:0 0 14px}.hero .hq b{color:#5e4818;font-weight:600;letter-spacing:1px}
.hero .hb{position:absolute;inset:0;background-size:cover;background-position:center 60%}
.hero .ho{position:absolute;inset:0;background:linear-gradient(180deg,#000b 0,#0005 26%,#0000 46%,#0000 60%,#000c 100%)}
.hero .hf{position:absolute;inset:14px;border:1px solid #e6c67e99;border-radius:24px 24px 28px 28px;pointer-events:none}
.hero>div.ht,.hero>div.hbm{position:relative;z-index:1;width:100%}
.hero .bs{font:30px/1.6 Amiri,serif;color:#e6c67e;margin:0;text-shadow:0 2px 10px #0008}
.hero .lb2{color:#fff;opacity:.9;text-shadow:0 1px 8px #0008}
.hero .hn{font:400 clamp(48px,15vw,64px)/1.1 'Great Vibes','Cormorant Garamond',cursive;margin:6px 0 0;text-shadow:0 2px 16px #0009}.hero .hn i{font-style:normal;color:#e6c67e}
.hero .pill{display:inline-block;background:#ffffff26;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #ffffff55;border-radius:99px;padding:9px 20px;font-size:14px;letter-spacing:1px}
.hero .gs{margin:14px 0 0;font-size:13px;text-shadow:0 1px 8px #000a}.hero .gs b{display:block;font:600 22px 'Cormorant Garamond',Georgia,serif;overflow-wrap:anywhere}
.hero .sc{display:block;margin:16px auto 0;width:22px;height:36px;border:2px solid #ffffffcc;border-radius:12px;position:relative}.hero .sc:after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:#e6c67e;animation:sc 1.6s infinite}
@keyframes sc{60%{transform:translateY(12px);opacity:0}}@media(prefers-reduced-motion:reduce){.hero .sc:after{animation:none}}
.pen{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(160deg,var(--sgd),#a3b393);overflow:hidden;padding:56px 24px 112px}
.pen .pb{position:absolute;inset:0;background-size:cover;background-position:center 30%}
.pen .po{position:absolute;inset:0;background:linear-gradient(180deg,#0000 0,#0000 36%,#000a 68%,#000e 100%)}
.pen .pc{position:relative;z-index:1}.pen p{text-shadow:0 1px 10px #000a}
.pen h2{font:400 clamp(48px,15vw,64px)/1.1 'Great Vibes','Cormorant Garamond',cursive;color:#fff;margin:10px 0 6px;text-shadow:0 2px 16px #000a}
.st{font-size:14px;margin-top:10px;min-height:20px}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
</style></head><body>
<div id="cover" role="dialog" aria-label="Sampul undangan"><div class="cv-bg" id="cvbg"></div><div class="cv-ov"></div>
<div class="cv-top"><p class="cv-lb">The Wedding Of</p><h1 class="cv-nm" id="cn"></h1><p class="cv-tg" id="ctg"></p></div>
<div class="cv-bot"><div class="cv-gst"><small>Kepada Yth. Bapak/Ibu/Saudara/i:</small><b id="tm"></b></div><button class="btn g" id="open">✉ Buka Undangan</button><p class="cv-nt">Mohon maaf apabila ada kesalahan dalam penulisan nama &amp; gelar</p></div></div>
<div class="app" id="app"></div><button id="mus" aria-label="Musik" hidden>♪</button><div id="lb"><img alt=""></div><audio id="au" loop></audio>
<script src="data/data-undangan.js"></script><script src="js/fb.js"></script>
<script>
const D=DATA_UNDANGAN,$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const OFF={WIB:'+07:00',WITA:'+08:00',WIT:'+09:00'},BLN='Januari Februari Maret April Mei Juni Juli Agustus September Oktober November Desember'.split(' '),HR='Minggu Senin Selasa Rabu Kamis Jumat Sabtu'.split(' ');
const when=a=>new Date(`${a.tanggal}T${a.jam}:00${OFF[a.zona]||'+07:00'}`);
const tgl=a=>{const d=new Date(a.tanggal+'T12:00:00Z');return `${HR[d.getUTCDay()]}, ${d.getUTCDate()} ${BLN[d.getUTCMonth()]} ${d.getUTCFullYear()}`};
const P=D.pria,W=D.wanita,Q=new URLSearchParams(location.search).get('to')||'',tamu=Q||'Nama Tamu';
const sec=(id,lb,t,h,alt)=>`<section id="${id}" data-t="${e(lb)}"${alt?' class="alt"':''}><div class="lb2">${lb}</div><h2>${t}</h2><div class="dv">❀</div>${h}</section>`;
const z=d=>d.toISOString().replace(/[-:]|\.\d+/g,'');
const calu=(t,a)=>{const s=when(a);return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t+' '+P.panggilan+' & '+W.panggilan)}&dates=${z(s)}/${z(new Date(+s+36e5*3))}&location=${encodeURIComponent(a.tempat+', '+a.alamat)}`};
const evt=(t,a)=>`<div class="card"><h3>${t}</h3><p><b>${tgl(a)}</b><br>${e(a.jam)} ${e(a.zona)}${a.selesai?' - Selesai':''}</p><p>${e(a.tempat)}<br><small>${e(a.alamat)}</small></p>${a.maps?`<a class="btn o" target="_blank" rel="noopener" href="${e(a.maps)}">📍 Buka Google Maps</a>`:''}<a class="btn" target="_blank" rel="noopener" href="${calu(t,a)}">📅 Simpan Kalender</a></div>`;
const cp=(p,r,k)=>`<div class="av bg" style="background-image:url('${e(r)}')" role="img" aria-label="${e(p.nama)}"></div><h3 style="font-size:28px">${e(p.nama)}</h3><p>${e(p.anakKe||'')} dari pasangan<br><b>${e(p.ayah)}</b> & <b>${e(p.ibu)}</b><br><small>${e(p.domisili)}</small></p>`;
const rk=(D.hadiah.rekening||[]).slice(0,2),kl=D.keluarga&&D.keluarga.aktif?D.keluarga.daftar||[]:[];
const salin=(t,n)=>`<button class="btn o" data-cp="${e(n)}">${t}</button>`;
const HERO=(D.foto&&D.foto.hero)||(D.galeri&&(D.galeri[1]||D.galeri[0]))||D.foto.cover,hq=String(HERO||'').replace(/["\\]/g,'');
let h=`<section id="home" data-t="Beranda" class="hero"><div class="hs"><div class="hb" style="background-image:url(&quot;${e(hq)}&quot;)"></div><div class="ho"></div><div class="hf"></div><div class="ht"><p class="bs">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</p><div class="lb2">Undangan Pernikahan</div><h1 class="hn">${e(W.panggilan)} <i>&amp;</i> ${e(P.panggilan)}</h1></div><div class="hbm"><span class="pill">${tgl(D.akad)}${D.akad.kota?' • '+e(D.akad.kota):''}</span><p class="gs">Undangan khusus untuk<b>${e(tamu)}</b></p><span class="sc" aria-hidden="true"></span></div></div>${D.kutipan?`<div class="hq"><div class="dv">❀</div><p class="ar">${e(D.kutipan.arab)}</p><p class="ti"><i>"${e(D.kutipan.arti)}"</i></p><b>(${e(D.kutipan.sumber)})</b></div>`:''}</section>`;
h+=sec('mempelai','Pengantin','Mempelai Bahagia',`<p>Dengan memohon rahmat dan ridho Allah Subhanahu wa Ta'ala, kami bermaksud menyelenggarakan syukuran pernikahan putra-putri kami:</p>${cp(W,D.foto.mempelaiWanita)}<h2 style="font-size:40px;margin:0">&</h2>${cp(P,D.foto.mempelaiPria)}`);
h+=sec('acara','Hari Bahagia','Rangkaian Acara',`<p>Kami bermaksud menyelenggarakan Akad dan Resepsi Pernikahan pada:</p><div class="cd" id="cd"></div>${evt('Akad Pernikahan',D.akad)}${D.resepsi&&D.resepsi.aktif?evt('Resepsi Pernikahan',D.resepsi):''}${D.live?`<a class="btn o" target="_blank" rel="noopener" href="${e(D.live)}">▶ Siaran Langsung</a>`:''}`,1);
if(D.kisah&&D.kisah.length)h+=sec('kisah','Perjalanan','Kisah Cinta',D.kisah.map(k=>`<div class="card"><b>${e(k.tahun)} · ${e(k.judul)}</b><p>${e(k.isi)}</p></div>`).join(''));
if(D.galeri&&D.galeri.length)h+=sec('galeri','Momen','Galeri',`<div class="gal">${D.galeri.map(g=>`<img loading="lazy" src="${e(g)}" alt="Foto prewedding" onerror="this.style.visibility='hidden'">`).join('')}</div>`,1);
if(D.tampil.hadiah&&(rk.length||D.hadiah.alamatKado))h+=sec('hadiah','Tanda Kasih','Kado & Amplop Digital',`<p>Doa restu Anda merupakan karunia terindah bagi kami. Bagi yang ingin memberikan tanda kasih secara digital:</p>${rk.map(r=>`<div class="card"><b>${e(r.label)}</b><br><small>${e(r.jenis)}:</small><br><span style="font-size:22px">${e(r.nomor)}</span><br>a.n. <b>${e(r.nama)}</b><br>${salin('Salin Nomor',r.nomor)}</div>`).join('')}${D.hadiah.alamatKado?`<div class="card"><h3>Kirim Kado Fisik</h3><p>Penerima: <b>${e(D.hadiah.penerima||'')}</b><br>${e(D.hadiah.alamatKado)}</p>${salin('Salin Alamat Pengiriman',D.hadiah.alamatKado)}</div>`:''}`);
const fs=(id,ex)=>`<label for="n${id}">Nama</label><input id="n${id}" maxlength="40" required value="${e(Q)}"><label for="s${id}">Konfirmasi Kehadiran</label><select id="s${id}"><option value="hadir">Hadir</option><option value="ragu">Ragu-ragu</option><option value="tidak">Tidak Hadir</option></select>${ex}<br><br><button class="btn">${id==1?'Konfirmasi Sekarang':'Kirim Ucapan'}</button><div class="st" id="st${id}" role="status"></div>`;
h+=sec('ucapan','Konfirmasi & Doa','Buku Tamu & RSVP',`<p>Kehadiran dan doa restu Anda merupakan kehormatan serta kebahagiaan bagi kami sekeluarga:</p><form id="f1" class="card"><h4 style="font-size:22px">Konfirmasi Kehadiran (RSVP)</h4>${fs(1,'<label for="j1">Jumlah Tamu yang Hadir</label><select id="j1">'+[1,2,3,4].map(i=>`<option value="${i}">${i} Orang</option>`).join('')+'</select>')}</form><form id="f2" class="card"><h4 style="font-size:22px">Kirim Ucapan & Doa Restu</h4>${fs(2,'<label for="p2">Ucapan & Doa <small id="ct">(0/300)</small></label><textarea id="p2" maxlength="300" rows="4" required></textarea>')}</form><div id="msgs"></div>`,1);
if(kl.length)h+=sec('turut-mengundang','Segenap Keluarga','Turut Mengundang',`<p>Ungkapan rasa hormat dan terima kasih yang tulus kepada segenap keluarga besar, alim ulama, tokoh masyarakat, dan handai taulan:</p><ol class="kl">${kl.map((k,i)=>`<li${i>=8?' hidden data-x':''}>${e(k)}</li>`).join('')}</ol>${kl.length>8?'<button class="btn o" id="more">Lihat Selengkapnya</button>':''}`);
const PN=D.foto.penutup?String(D.foto.penutup).replace(/["\\]/g,''):'';
h+=`<section id="penutup" data-t="Penutup" class="pen">${PN?`<div class="pb" style="background-image:url(&quot;${e(PN)}&quot;)" role="img" aria-label="Foto penutup"></div><div class="po"></div>`:''}<div class="pc"><p>Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kedua mempelai.</p><p>Wassalamu'alaikum Wr. Wb.</p><h2>${e(W.panggilan)} & ${e(P.panggilan)}</h2>${D.demo?'<small>Data contoh (DEMO)</small>':''}</div></section>`;
$('#app').innerHTML=h+'<nav id="nv"></nav>';
const IC={home:'🏠',mempelai:'💑',acara:'📅',hadiah:'🎁',ucapan:'💬','turut-mengundang':'👪'};
$('#nv').innerHTML=[...document.querySelectorAll('section')].filter(s=>IC[s.id]).map(s=>`<a href="#${s.id}"><span>${IC[s.id]}</span>${s.dataset.t}</a>`).join('');
$('#cn').innerHTML=`${e(W.panggilan)} <i>&amp;</i> ${e(P.panggilan)}`;$('#cvbg').style.backgroundImage=`url("${String(D.foto.cover||'').replace(/["\\]/g,'')}")`;$('#ctg').textContent=tgl(D.akad);$('#tm').textContent=tamu;document.body.style.overflow='hidden';
const au=$('#au');if(D.musik){au.src=D.musik;$('#mus').hidden=false}
$('#open').onclick=()=>{$('#cover').classList.add('off');document.body.style.overflow='';if(D.musik)au.play().catch(()=>{})};
$('#mus').onclick=()=>au.paused?au.play():au.pause();
const ob=new IntersectionObserver(a=>a.forEach(x=>x.isIntersecting&&x.target.classList.add('in')),{threshold:.1});document.querySelectorAll('section').forEach(s=>ob.observe(s));
const T=when(D.akad);setInterval(function t(){let s=Math.max(0,(T-Date.now())/1000|0);$('#cd').innerHTML=[['Hari',86400],['Jam',3600],['Menit',60],['Detik',1]].map(([l,m])=>{const v=s/m|0;s-=v*m;return `<div><b>${v}</b><small>${l}</small></div>`}).join('');return t}(),1000);
document.querySelectorAll('[data-cp]').forEach(b=>{const o=b.textContent;b.onclick=()=>navigator.clipboard.writeText(b.dataset.cp).then(()=>b.textContent='Tersalin ✓',()=>b.textContent='Salin manual')});
document.querySelectorAll('.gal img').forEach(i=>i.onclick=()=>{$('#lb img').src=i.src;$('#lb').style.display='flex'});$('#lb').onclick=()=>$('#lb').style.display='none';
if($('#more'))$('#more').onclick=function(){document.querySelectorAll('[data-x]').forEach(l=>l.hidden=false);this.remove()};
$('#p2').oninput=()=>$('#ct').textContent=`(${$('#p2').value.length}/300)`;
let show=D.tampil.ucapan;
async function muat(){const m=$('#msgs');if(!FB.ok())return;try{const c=await FB.pengaturan();if(c.ucapan!==undefined)show=c.ucapan;if(!show)return;m.innerHTML=(await FB.ucapan()).filter(u=>u.pesan).map(u=>`<p><b>${e(u.nama)}</b> · ${u.hadir=='hadir'?'Hadir':u.hadir=='tidak'?'Tidak hadir':'Ragu-ragu'}<br>${e(u.pesan)}</p>`).join('')}catch(x){m.textContent='Ucapan belum dapat dimuat.'}}muat();
async function kirim(ev,id){ev.preventDefault();const st=$('#st'+id);if(!FB.ok()){st.textContent='Firebase belum dikonfigurasi.';return}st.textContent='Mengirim…';
const hd=$('#s'+id).value;try{await FB.kirim({nama:$('#n'+id).value.trim().slice(0,40),hadir:hd,jumlah:id==1&&hd=='hadir'?+$('#j1').value:0,pesan:id==2?$('#p2').value.trim().slice(0,300):''});st.textContent=id==1?'Konfirmasi terkirim ✓':'Terima kasih, ucapan terkirim ✓';if(id==2){$('#p2').value='';muat()}}catch(x){st.textContent='Gagal mengirim: '+x.message}}
$('#f1').onsubmit=v=>kirim(v,1);$('#f2').onsubmit=v=>kirim(v,2);
</script></body></html>
